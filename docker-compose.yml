# Two containers that share one SQLite database in the "data" volume:
#
#   worker  Python: polls Koruxa, posts to Discord, runs market refreshes.
#           Runs on the host network so that CHROME_CDP_URL=http://127.0.0.1:9222 reaches
#           the Chrome you run yourself. Headful Chrome ignores
#           --remote-debugging-address and listens on 127.0.0.1 only, so a bridged
#           container could not reach it without a forward.
#   web     Go: login, market helper, tracker. Reads and writes the database only.
#
#   docker compose up -d --build

name: koruxa-listener

services:
  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      CACHE_FILE: /data/cache.json
      MARKET_DB: /data/koruxa-listener.db
    volumes:
      - data:/data

  web:
    build: ./web
    restart: unless-stopped
    environment:
      MARKET_DB: /data/koruxa-listener.db
      MARKET_HOST: 0.0.0.0
      MARKET_PORT: "8091"
    # Published on localhost only. Set WEB_BIND=0.0.0.0 in .env to serve the network
    # (put HTTPS in front of it first: the login is sent as plain HTTP otherwise).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${MARKET_PORT:-8091}:8091"
    volumes:
      - data:/data
    depends_on:
      - worker

volumes:
  data:
